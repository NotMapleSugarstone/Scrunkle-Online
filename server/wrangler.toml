name = "scrunkle-rooms"
main = "worker/index.ts"
compatibility_date = "2026-01-01"
send_metrics = false

# 游戏已发布副本的来源（不含路径，小写）。任意 localhost 端口始终允许。
[vars]
ALLOWED_ORIGINS = "https://maplesugarstone.github.io"
ROOMS_PER_DAY = "300"

[observability]
enabled = true

# 只保留房间服务器自身的日志行。每次运行都记录日志会让每条转发消息
# 计入每日日志限额。
[observability.logs]
invocation_logs = false

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# 免费计划需要由 SQLite 支持的 Durable Objects。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]
