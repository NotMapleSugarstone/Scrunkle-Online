# 每次推送到 main 时构建游戏并将 dist/ 发布为仓库站点。
# 生成的代码和 public/assets 已提交，因此构建不需要源项目或参考运行器。
# 在线游玩使用下方的房间服务器。将它设为已部署的房间服务器，或设置名为 RELAY_URL 的仓库变量。
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          RELAY_URL: ${{ vars.RELAY_URL || 'https://srt-relay-proxy.paubird5.workers.dev' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
